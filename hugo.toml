baseURL = 'https://waleedayoub.com'
languageCode = 'en-us'
title = 'Waleed Ayoub'
theme = "drishtikon"

[pagination]
  pagerSize = 10

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[params]
  # Profile section (left column)
  profilePhoto = "/images/headshot-waleed.png"
  profileDescription = "Hi, I'm Waleed. I've spent 20+ years building data-driven products and scaling teams at the intersection of data, software, and product leadership. Motivated by curiosity and good vibes. [More about me](/about/) or [reach out](mailto:info@waleedayoub.com)."

  # Updates section (right column intro)
  profileUpdates = "Let's build something together!"

  # Social links
  github = "https://github.com/waleedayoub"
  email = "mailto:info@waleedayoub.com"
  linkedin = "https://www.linkedin.com/in/waleedayoub/"
  # pinterest = ""
  # cv = "/cv.pdf"

  # KaTeX math support
  math = true

  # Color customization (uncomment to override defaults)
  backgroundColor = "#f3f5f7"   # pale slate blue
  # linksColor = "#805690"        # purple (default)
  # textColor = "#333"            # dark gray (default)

[menu]
  [[menu.main]]
    identifier = "posts"
    name       = "posts"
    url        = "/posts/"
    weight     = 1

  [[menu.main]]
    identifier = "about"
    name       = "about"
    url        = "/about/"
    weight     = 2

  [[menu.main]]
    identifier = "speaking"
    name       = "speaking"
    url        = "/speaking/"
    weight     = 3

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.parser]
      attribute = true
      autoHeadingID = true
      autoHeadingIDType = "github"
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "catppuccin-mocha"
    tabWidth = 4
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
