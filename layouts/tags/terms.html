{{ define "main" }}
<div class="tags-page-container">
    <h1 class="tags-page-heading">All Tags</h1>

    <ul class="tags-list">
        {{ range .Data.Terms.Alphabetical }}
        <li class="tag-item">
            <a href="{{ .Page.RelPermalink }}" class="tag-link">{{ .Page.Title }}</a>
            <span class="tag-count">({{ .Count }})</span>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
